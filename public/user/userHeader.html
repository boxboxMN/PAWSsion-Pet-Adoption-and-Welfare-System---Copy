<div class="h-20 sm:h-24 bg-white border-b border-gray-200 shadow-sm px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-3">

    <!-- LEFT -->
    <div class="flex flex-col min-w-0">
        <h1 id="pageTitle" class="text-lg sm:text-2xl lg:text-4xl font-bold text-blue-700 truncate"></h1>

        <p id="pageSubtitle" class="hidden sm:block text-xs sm:text-sm text-gray-500 mt-1 truncate"></p>
    </div>

    <!-- RIGHT -->
    <div class="flex items-center gap-2 sm:gap-5 relative shrink-0">

        <!-- Notification -->
        <button
            id="notificationBtn"
            class="relative w-9 h-9 sm:w-11 sm:h-11 flex items-center justify-center rounded-full bg-gray-100 hover:bg-blue-50 transition shrink-0">

            <i class="fas fa-bell text-base sm:text-xl text-blue-900"></i>

            <!-- Red Dot -->
            <span class="absolute top-1.5 right-1.5 sm:top-2 sm:right-2 w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-red-500"></span>

        </button>

         <!-- Notification Popup -->
         <div id="notificationPopup" class="hidden absolute top-12 sm:top-14 right-0 sm:right-16 w-72 sm:w-80 max-w-[90vw] bg-white border border-gray-200 rounded-2xl shadow-xl p-4 sm:p-5 z-50">
            <div class="flex items-center justify-between mb-3 sm:mb-4">
                <h3 class="text-base sm:text-lg font-semibold text-gray-800">Notifications</h3>
                <button id="userMarkAllReadBtn" class="text-xs font-semibold text-blue-700 hover:underline">Mark all read</button>
            </div>
            <ul id="userNotifList" class="space-y-3 text-sm text-gray-600 max-h-72 overflow-y-auto">
                <li class="text-gray-400 text-xs text-center py-4">Loading...</li>
            </ul>
        </div>

        <!-- Profile -->
        <a href="/profile"
           id="profileLink"
           class="flex items-center gap-0 sm:gap-2 border border-blue-700 rounded-full p-1 sm:px-3 sm:py-1.5 bg-white shadow-sm hover:bg-blue-50 transition shrink-0">

            <div id="topbarAvatarContainer" class="w-8 h-8 rounded-full overflow-hidden flex items-center justify-center bg-gray-100 border border-blue-200 shrink-0">
                <i class="fas fa-user-circle text-2xl text-gray-500" id="topbarDefaultIcon"></i>
            </div>
            
            <span id="topbarUserName" class="hidden sm:inline font-medium text-blue-900 max-w-40 truncate">
                User
            </span>
            
            <!-- <span class="hidden sm:inline font-medium text-blue-900">
                Profile
            </span> -->

        </a>

    </div>

</div>
